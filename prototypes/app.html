<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetSocial — Full App Prototype</title>
<style>
  :root {
    --paper:#FFFCF9; --card:#FFFFFF; --ink:#4A3F38; --muted:#9C8F86;
    --muted-bg:#F6EFE8; --border:#F1E7DE; --primary:#F4915C;
    --danger:#E8637F; --success:#4FAE74; --radius:20px;
    --font: ui-rounded,"SF Pro Rounded","Segoe UI Variable",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font); background:#E8E2DC; color:var(--ink);
    min-height:100vh; display:flex; gap:28px; padding:28px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}

  /* ---------- SIDEBAR ---------- */
  .side{width:230px;flex-shrink:0;position:sticky;top:28px;align-self:flex-start;max-height:calc(100vh - 56px);overflow-y:auto;padding-right:6px}
  .side h1{font-size:19px;color:#3A312B;margin-bottom:2px}
  .side .sub{font-size:12px;color:#6B5F57;margin-bottom:18px;line-height:1.5}
  .grp{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8C7F76;margin:16px 0 6px}
  .navbtn{display:block;width:100%;text-align:left;padding:7px 11px;border-radius:10px;font-size:13px;color:#5C5049;transition:.12s}
  .navbtn:hover{background:rgba(255,255,255,.6)}
  .navbtn.on{background:var(--primary);color:#fff;font-weight:600}
  .side a{display:block;padding:7px 11px;border-radius:10px;font-size:13px;color:#5C5049;text-decoration:none}
  .side a:hover{background:rgba(255,255,255,.6)}

  /* ---------- PHONE ---------- */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
  .phone{
    width:390px;height:844px;background:var(--paper);border-radius:44px;
    box-shadow:0 30px 60px rgba(70,50,40,.28),0 0 0 10px #2B2420,0 0 0 12px #4A403A;
    position:relative;overflow:hidden;flex-shrink:0
  }
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:132px;height:30px;background:#2B2420;border-radius:0 0 18px 18px;z-index:60}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column}
  .caption{font-size:12px;color:#6B5F57;text-align:center;max-width:420px;line-height:1.55}

  /* ---------- CHROME ---------- */
  .topbar{
    padding:52px 16px 12px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--border);background:rgba(255,252,249,.96);flex-shrink:0
  }
  .topbar .ttl{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand{font-size:19px;font-weight:800;color:var(--primary);flex:1;display:flex;align-items:center;gap:7px}
  .iconbtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink);flex-shrink:0}
  .iconbtn:hover{background:var(--muted-bg)}
  svg{width:20px;height:20px;display:block}
  /* icon that fills its wrapper instead of the 20px default */
  .ib{display:block}
  .ib svg{width:100%;height:100%}
  .flip{transform:rotate(180deg)}
  .body{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .body::-webkit-scrollbar{width:0}
  .pad{padding:16px}
  .tabbar{
    border-top:1px solid var(--border);background:rgba(255,252,249,.97);
    display:flex;justify-content:space-around;align-items:flex-end;padding:9px 6px 24px;flex-shrink:0
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:600;color:var(--muted);flex:1}
  .tab.on{color:var(--primary)}
  .tab-fab{width:48px;height:48px;border-radius:17px;background:var(--primary);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 10px 20px rgba(244,145,92,.42)}
  .tab-fab svg{width:24px;height:24px}

  /* ---------- PRIMITIVES ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .card + .card{margin-top:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:14px;font-size:14.5px;font-weight:600;transition:.12s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(244,145,92,.3)}
  .btn-outline{border:1.5px solid var(--border);color:var(--ink);background:var(--card)}
  .btn-ghost{color:var(--muted)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-sm{height:34px;padding:0 14px;font-size:13px;border-radius:11px}
  .btn-block{display:flex;width:100%}
  .row{display:flex;gap:10px;align-items:center}
  .av{border-radius:50%;display:grid;place-items:center;font-weight:700;flex-shrink:0;overflow:hidden}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--muted-bg);color:#7D6E63}
  .badge.ok{background:#DDF0E2;color:#2F6B48}
  .badge.warn{background:#FDE8D4;color:#96602C}
  .badge.bad{background:#FBE0E8;color:#9C4A63}
  .badge.info{background:#DCE8F7;color:#3B587C}
  .muted{color:var(--muted)}
  .sm{font-size:12.5px}
  .xs{font-size:11.5px}
  .b{font-weight:700}
  .sec-title{font-size:13px;font-weight:700;color:#7D6E63;margin:18px 0 9px;letter-spacing:.02em}
  .sec-title:first-child{margin-top:0}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#7D6E63;margin-bottom:6px}
  .inp{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none}
  .inp:focus{border-color:var(--primary)}
  textarea.inp{resize:none;line-height:1.5}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card);border:1.5px solid var(--border);color:#6E625A}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .switch{width:46px;height:27px;border-radius:14px;background:var(--border);position:relative;transition:.18s;flex-shrink:0}
  .switch.on{background:var(--primary)}
  .switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
  .switch.on i{left:22px}
  .empty{text-align:center;padding:44px 24px;color:var(--muted)}
  .empty .eic{width:62px;height:62px;border-radius:50%;background:var(--muted-bg);display:grid;place-items:center;margin:0 auto 14px;color:#B7A99E}
  .empty .eic svg{width:28px;height:28px}
  .divider{height:1px;background:var(--border);margin:14px 0}
  .listrow{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left}
  .listrow:last-child{border-bottom:none}
  .listrow:active{background:var(--muted-bg)}
  .grow{flex:1;min-width:0}
  .clamp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* media */
  .media{position:relative;height:230px;overflow:hidden}
  .media.sq{height:290px}
  .m1{background:linear-gradient(150deg,#FFD9B8,#F5A578 55%,#E9BE9C)}
  .m2{background:linear-gradient(150deg,#CFE3F5,#94BEE0 55%,#BDD8EC)}
  .m3{background:linear-gradient(150deg,#E4DCF4,#B7A5DF 55%,#D3C8ED)}
  .m4{background:linear-gradient(150deg,#D8EEDD,#93CDA7 55%,#C2E3CC)}
  .m5{background:linear-gradient(150deg,#FBDCE5,#EFA3B8 55%,#F6C6D3)}
  .m6{background:linear-gradient(150deg,#F7E9C9,#DFC386 55%,#EDDCB2)}
  .media::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 26% 32%,rgba(255,255,255,.55),transparent 42%),
               radial-gradient(circle at 74% 72%,rgba(255,255,255,.35),transparent 46%)
  }
  .media .tagline{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(43,36,32,.5);color:#fff;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:600;backdrop-filter:blur(4px)}

  /* post card */
  .post{margin:0 16px 14px}
  .post .head{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .post .acts{display:flex;align-items:center;gap:6px;padding:10px 12px}
  .actbtn{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:12px;font-size:13px;font-weight:600;color:var(--muted)}
  .actbtn:hover{background:var(--muted-bg)}
  .actbtn.liked{color:var(--danger)}
  .post .cap{padding:0 14px 13px;font-size:14px;line-height:1.55}

  /* grid */
  .ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
  .ggrid .media{height:127px;border-radius:0}

  /* sheet */
  .scrim{position:absolute;inset:0;background:rgba(35,28,24,.45);z-index:70;display:none}
  .scrim.open{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 0 26px;z-index:71;transform:translateY(100%);transition:.24s cubic-bezier(.3,1,.5,1)}
  .scrim.open .sheet{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:3px;background:var(--border);margin:6px auto 10px}

  /* chat */
  .bub{max-width:74%;padding:10px 13px;border-radius:18px;font-size:13.5px;line-height:1.45}
  .bub.them{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:6px;align-self:flex-start}
  .bub.me{background:var(--primary);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}

  /* slots */
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .slot{padding:11px 0;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:13px;font-weight:600}
  .slot.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .slot.off{color:#C9BCB2;background:var(--muted-bg);border-color:transparent;text-decoration:line-through}

  .toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);background:#2F2722;color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:90;opacity:0;transition:.22s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

/* ============================== HELPERS ============================== */
const $ = id => document.getElementById(id);
function go(id){ if(id!==S.screen){ S.stack.push(S.screen); S.screen=id; } render(); }
function back(){ S.screen = S.stack.pop() || "feed"; render(); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),1700); }
function set(path,val){ S[path]=val; render(); }
function setFilter(k,v){ S.filters[k]=v; render(); }
function toggleLike(id){ S.likes[id]=!S.likes[id]; S.bumps[id]=S.likes[id]?1:0; render(); }
function toggleSave(k){ S.saved[k]=!S.saved[k]; render(); toast(S.saved[k]?"Saved":"Removed from saved"); }
function toggleFollow(k){ S.following[k]=!S.following[k]; render(); }
function addComment(){ const i=$("cin"); if(!i.value.trim())return; S.comments.push({who:"You",init:"AR",tone:1,txt:i.value.trim(),when:"now"}); render(); }
function sendMsg(){ const i=$("min"); if(!i.value.trim())return; S.chat.push({me:true,t:i.value.trim()}); render(); const b=$("chatbody"); if(b)b.scrollTop=b.scrollHeight; }
function pickSlot(t,ok){ if(!ok){toast("That slot is already booked");return;} S.slot=t; render(); }

function openSheet(html){ $("sheet").innerHTML=`<div class="grab"></div>${html}`; $("scrim").classList.add("open"); }
function closeSheet(e){ if(!e || e.target.id==="scrim") $("scrim").classList.remove("open"); }
function createSheet(){
  const item=(icn,label,scr)=>`<button class="listrow" onclick="closeSheet();go('${scr}')">
    <div class="av" style="width:38px;height:38px;background:var(--muted-bg);color:var(--primary)">${ic(icn)}</div>
    <span class="grow b" style="font-size:14.5px">${label}</span></button>`;
  openSheet(`<div style="padding:2px 16px 10px" class="b">Create</div>
    ${item("camera","New post","create")}
    ${item("pawprint","Add a pet","addPet")}
    ${item("siren","Lost &amp; Found alert","lostNew")}
    ${item("heart","List a pet for adoption","adoptionNew")}
    ${item("cart","Sell an item","marketNew")}`);
}

/* chrome builders */
function topbar(title,{withBack=true,right=""}={}){
  return `<div class="topbar">
    ${withBack?`<button class="iconbtn" onclick="back()">${ic("back")}</button>`:""}
    <div class="ttl">${title}</div>${right}</div>`;
}
function homebar(){
  return `<div class="topbar">
    <div class="brand">${ic("pawprint",true)} PetSocial</div>
    <button class="iconbtn" onclick="go('messages')">${ic("chat")}</button>
    <button class="iconbtn" onclick="go('activity')">${ic("bell")}</button>
  </div>`;
}
function tabbar(active){
  const t=(icn,label,scr)=>`<button class="tab ${active===scr?'on':''}" onclick="go('${scr}')">${ic(icn,active===scr)}<span>${label}</span></button>`;
  return `<div class="tabbar">
    ${t("home","Home","feed")}
    ${t("compass","Explore","explore")}
    <button class="tab" onclick="createSheet()"><div class="tab-fab">${ic("plus")}</div></button>
    ${t("bell","Activity","activity")}
    ${t("user","Profile","owner")}
  </div>`;
}
function chips(key,opts){
  return `<div class="chips">${opts.map(o=>`<button class="chip ${S.filters[key]===o?'on':''}" onclick="setFilter('${key}','${o}')">${o}</button>`).join("")}</div>`;
}
function empty(icn,title,sub,cta){
  return `<div class="empty"><div class="eic">${ic(icn)}</div>
    <p class="b" style="font-size:15px;color:var(--ink);margin-bottom:5px">${title}</p>
    <p class="sm" style="line-height:1.5;margin-bottom:${cta?'16px':'0'}">${sub}</p>${cta||""}</div>`;
}
function postCard(p){
  const liked=S.likes[p.id], n=p.likes+(S.bumps[p.id]||0);
  const name = p.anon && !p.who.startsWith("Anonymous") ? "Anonymous owner" : p.who;
  return `<div class="card post">
    <div class="head">
      ${av(p.init,p.tone,42)}
      <div class="grow">
        <div class="b clamp" style="font-size:14.5px">${name} ${p.anon?`<span class="badge" style="vertical-align:2px">anon</span>`:""}</div>
        <div class="xs muted">${p.meta}</div>
      </div>
      <button class="iconbtn">${ic("more")}</button>
    </div>
    <button style="display:block;width:100%" onclick="go('post')">
      <div class="media ${p.m}">${p.tagline?`<span class="tagline">${ic("pin")} ${p.tagline}</span>`:""}</div>
    </button>
    <div class="acts">
      <button class="actbtn ${liked?'liked':''}" onclick="toggleLike(${p.id})">${ic("heart",liked)} ${n}</button>
      <button class="actbtn" onclick="go('post')">${ic("comment")} ${p.cm}</button>
      <button class="actbtn" onclick="go('messages')">${ic("send")}</button>
      <div class="grow"></div>
      <button class="actbtn ${S.saved['p'+p.id]?'liked':''}" onclick="toggleSave('p${p.id}')">${ic("bookmark",!!S.saved['p'+p.id])}</button>
    </div>
    <p class="cap"><span class="b">${name}</span> ${p.cap}</p>
  </div>`;
}

        <button class="card" style="text-align:left" onclick="go('marketDetail')">
          <div class="media ${m.m}" style="height:120px"></div>
          <div style="padding:11px">
            <div class="b" style="font-size:14px">${m.price}</div>
            <div class="xs" style="margin-top:4px;line-height:1.4;height:32px;overflow:hidden">${m.title}</div>
            <div class="xs muted" style="margin-top:6px">${m.cond}</div>
          </div>
        </button>`).join("")}
    </div>
    <div style="height:16px"></div>
  </div>`},

marketDetail:{ tab:null, cap:"Listing detail — 'Message seller' drops into the same DM system.", r:()=>{
  const m=MARKET[0];
  return `${topbar("Listing",{right:`<button class="iconbtn" onclick="toggleSave('mk')">${ic("bookmark",!!S.saved.mk)}</button>`})}
  <div class="body">
    <div class="media sq ${m.m}"></div>
    <div class="pad">
      <div class="b" style="font-size:23px">${m.price}</div>
      <div style="font-size:15px;margin:5px 0 9px;line-height:1.4">${m.title}</div>
      <div class="row" style="gap:7px;margin-bottom:14px">
        <span class="badge info">${m.cat}</span><span class="badge ok">${m.cond}</span><span class="badge">Dhanmondi</span>
      </div>
      <p class="sm" style="line-height:1.6">${m.note}</p>
      <div class="divider"></div>
      <div class="sec-title" style="margin-top:0">Seller</div>
      <button class="row" style="width:100%" onclick="go('owner')">
        ${av(m.init,m.tone,44)}
        <div class="grow" style="text-align:left"><div class="b sm">${m.seller} Ahmed</div><div class="xs muted" style="margin-top:2px">Joined 2024 · 12 items sold</div></div>
        <span class="ib flip" style="color:var(--muted);width:18px;height:18px">${ic("back")}</span>
      </button>
    </div>
    <div style="height:8px"></div>
  </div>
  <div class="row" style="padding:12px 16px 22px;border-top:1px solid var(--border);background:var(--paper)">
    <button class="btn btn-outline" onclick="toggleSave('mk')">${ic("heart",!!S.saved.mk)}</button>
    <button class="btn btn-primary grow" onclick="go('chat')">${ic("chat")} Message seller</button>
  </div>`}},

marketNew:{ tab:null, cap:"Create a listing.", r:()=>`
  ${topbar("Sell an item",{right:`<button class="btn btn-primary btn-sm" onclick="go('market');toast('Listing published')">Publish</button>`})}
  <div class="body"><div class="pad">
    <div class="card" style="height:150px;display:grid;place-items:center;color:var(--muted);border-style:dashed;margin-bottom:18px">
      <div style="text-align:center"><div class="ib" style="width:40px;height:40px;margin:0 auto 8px;color:#C3B4A8">${ic("camera")}</div><p class="sm b">Add photos</p></div>
    </div>
    <div class="field"><label>Title</label><input class="inp" placeholder="Airline-approved pet carrier"></div>
    <div class="row" style="gap:12px">
      <div class="field grow"><label>Price (৳)</label><input class="inp" placeholder="3400"></div>
      <div class="field grow"><label>Condition</label><select class="inp"><option>New</option><option>Like new</option><option>Used</option></select></div>
    </div>
    <div class="field"><label>Category</label>
      <select class="inp"><option>Accessories</option><option>Food</option><option>Bedding</option><option>Furniture</option><option>Toys</option></select></div>
    <div class="field"><label>Description</label><textarea class="inp" rows="5" placeholder="Condition, age, why you're selling…"></textarea></div>
  </div></div>`},
};

function notifRow(n){
  const icn = n.t==="like"?"heart":n.t==="comment"?"comment":"user";
  const col = n.t==="like"?"var(--danger)":n.t==="comment"?"var(--primary)":"#4FAE74";
  return `<button class="listrow" onclick="go('${n.t==='follow'?'pet':'post'}')">
    <div style="position:relative">${av(n.init,n.tone,44)}
      <span style="position:absolute;right:-3px;bottom:-3px;width:21px;height:21px;border-radius:50%;background:${col};color:#fff;border:2.5px solid var(--paper);display:grid;place-items:center">
        <span class="ib" style="width:11px;height:11px">${ic(icn,true)}</span></span>
    </div>
    <div class="grow"><div class="sm"><span class="b">${n.who}</span> ${n.txt}</div>
      <div class="xs muted" style="margin-top:3px">${n.when}</div></div>
    ${n.t==="follow"
      ? `<span class="btn btn-outline btn-sm">Follow back</span>`
      : `<div class="media m${(n.who.length%6)+1}" style="width:42px;height:42px;border-radius:11px"></div>`}
  </button>`;
}

/* ============================== NAV INDEX ============================== */
const GROUPS = [
  ["Auth", [["login","Login"],["signup","Sign up"]]],
  ["Home", [["feed","Feed"],["post","Post detail"],["create","New post"],["explore","Explore"]]],
  ["Profiles", [["owner","Owner profile"],["editProfile","Edit profile"],["pet","Pet profile"],["addPet","Add a pet"],["health","Health log"],["healthNew","New health entry"]]],
  ["Social", [["activity","Activity"],["messages","Messages"],["chat","Chat thread"]]],
  ["Communities", [["communities","Communities"],["community","Community detail"]]],
  ["Lost & Found", [["lost","Lost &amp; Found"],["lostNew","Post an alert"]]],
  ["Adoption", [["adoption","Listings"],["adoptionDetail","Listing detail"],["adoptionNew","New listing"]]],
  ["Vet", [["vet","Vet directory"],["vetDetail","Book appointment"],["appointments","My appointments"]]],
  ["Marketplace", [["market","Marketplace"],["marketDetail","Listing detail"],["marketNew","Sell an item"]]],
];

function renderNav(){
  $("nav").innerHTML = GROUPS.map(([g,items])=>
    `<div class="grp">${g}</div>` +
    items.map(([id,label])=>`<button class="navbtn ${S.screen===id?'on':''}" onclick="go('${id}')">${label}</button>`).join("")
  ).join("");
}

function render(){
  const sc = SCREENS[S.screen];
  $("screen").innerHTML = sc.r();
  $("cap").textContent = sc.cap || "";
  renderNav();
}
render();
</script>
